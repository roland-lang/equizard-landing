<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ wizard_title }} Setup – Equizard</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Montserrat', Arial, sans-serif;
      background:#f6f7fb;
      color:#111827;
      padding:24px 16px 40px;
    }
    .wrap{ max-width:760px; margin:0 auto; }
    .card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:22px;
      box-shadow:0 4px 18px rgba(17,24,39,0.05);
    }
    h1{ margin-top:0; margin-bottom:10px; }
    .muted{ color:#6b7280; }

    label{
      display:block;
      font-weight:600;
      margin-top:16px;
      margin-bottom:6px;
    }

    input{
      width:100%;
      padding:12px 14px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:16px;
    }

    .options{
      margin-top:18px;
      display:grid;
      gap:10px;
    }

    .option{
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:12px;
      cursor:pointer;
    }

    .option input{
      margin-right:8px;
    }

    .btn{
      display:inline-block;
      margin-top:20px;
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:#fff;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    .warning{
      margin-top:12px;
      padding:12px;
      background:#fff7ed;
      border:1px solid #fdba74;
      border-radius:10px;
      color:#7c2d12;
      font-size:14px;
    }

    .back{
      display:inline-block;
      margin-top:18px;
      color:#374151;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">

      <h1>{{ wizard_title }} setup</h1>

      <p class="muted">
        Complete this short form to create your event workspace.
      </p>

      <form id="createForm" action="/start-wizard" method="post">

        <input type="hidden" name="wizard" value="{{ wizard }}">

        <!-- PRE-FILLED FIELDS -->
        <label>Event name</label>
        <input name="event_name" value="{{ event_name or '' }}" required>

        <label>Club / organiser</label>
        <input name="club_name" value="{{ club_name or '' }}" required>

        <label>Contact email</label>
        <input name="contact_email" type="email" value="{{ contact_email or '' }}" required>

        <label>Date of event</label>
        <input name="competition_date" type="date" value="{{ competition_date or '' }}" required>

        <!-- LICENCE OPTIONS -->
        <label>Select access</label>

        <div class="options">

          <label class="option">
            <input type="radio" name="licence" value="2_week"
              {% if licence == "2_week" or not licence %}checked{% endif %}>
            <strong>2 weeks access</strong><br>
            <span class="muted">£25 / £35</span>
          </label>

          <label class="option">
            <input type="radio" name="licence" value="1_month"
              {% if licence == "1_month" %}checked{% endif %}>
            <strong>1 month access</strong><br>
            <span class="muted">£35 / £45</span>
          </label>

          <label class="option">
            <input type="radio" name="licence" value="free"
              {% if licence == "free" %}checked{% endif %}>
            <strong>Practice (demo)</strong><br>
            <span class="muted">No upload / limited features</span>
          </label>

        </div>

        {% if warning %}
          <div class="warning">{{ warning }}</div>
        {% endif %}

        <button id="submitBtn" type="submit" class="btn">Continue</button>

      </form>

      <a class="back" href="/">← Back to Equizard</a>

    </div>
  </div>

  <script>
    const form = document.getElementById("createForm");
    const btn = document.getElementById("submitBtn");

    let submitted = false;

    form.addEventListener("submit", function () {
      if (submitted) return false;
      submitted = true;
      btn.disabled = true;
      btn.textContent = "Continuing…";
    });
  </script>
</body>
</html>
