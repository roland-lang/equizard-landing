<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ wizard_title }} Setup – Equizard</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Montserrat', Arial, sans-serif;
      background:#f6f7fb;
      color:#111827;
      padding:24px 16px 40px;
    }
    .wrap{
      max-width:760px;
      margin:0 auto;
    }
    .card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:22px;
      box-shadow:0 4px 18px rgba(17,24,39,0.05);
    }
    h1{
      margin-top:0;
      margin-bottom:10px;
    }
    .muted{
      color:#6b7280;
    }
    label{
      display:block;
      font-weight:600;
      margin-top:16px;
      margin-bottom:6px;
    }
    input{
      width:100%;
      box-sizing:border-box;
      padding:12px 14px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:16px;
      background:#fff;
    }
    .summary{
      margin-top:18px;
      padding:14px 16px;
      background:#f9fafb;
      border:1px solid #e5e7eb;
      border-radius:12px;
    }
    .btn{
      display:inline-block;
      margin-top:20px;
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:#fff;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
    }
    .btn:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }
    .back{
      display:inline-block;
      margin-top:18px;
      color:#374151;
      text-decoration:none;
      font-weight:600;
    }
    .status{
      margin-top:12px;
      padding:12px 14px;
      background:#f9fafb;
      border:1px solid #e5e7eb;
      border-radius:10px;
      font-size:15px;
      color:#4b5563;
      display:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>{{ wizard_title }} setup</h1>

      <p class="muted">
        Complete this short form to create your event workspace and enter the scheduling engine.
      </p>

      <div class="summary">
        <strong>Selected product:</strong> {{ wizard_title }}<br>
        <strong>Package:</strong>
        {% if package_type == "triathlon" %}
          Any 3 phases
        {% else %}
          Up to 4 phases
        {% endif %}
      </div>

      <form id="createForm" action="/start-wizard" method="post">
        <input type="hidden" name="wizard" value="{{ wizard }}">

        <label for="event_name">Event name</label>
        <input id="event_name" name="event_name" type="text" required>

        <label for="club_name">Club / organiser</label>
        <input id="club_name" name="club_name" type="text" required>

        <label for="contact_email">Contact email</label>
        <input id="contact_email" name="contact_email" type="email" required>

        <label for="competition_date">Date of event</label>
        <input id="competition_date" name="competition_date" type="date" required>

        <button id="submitBtn" type="submit" class="btn">Continue</button>

        <div id="statusBox" class="status">
          Preparing {{ wizard_title }}…
        </div>
      </form>

      <a class="back" href="/">← Back to Equizard</a>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("createForm");
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("statusBox");

      let submitted = false;

      if (!form || !btn) return;

      form.addEventListener("submit", function (event) {
        if (submitted) {
          event.preventDefault();
          return false;
        }

        submitted = true;
        btn.disabled = true;
        btn.textContent = "Continuing…";

        if (status) {
          status.style.display = "block";
        }
      });
    })();
  </script>
</body>
</html>
